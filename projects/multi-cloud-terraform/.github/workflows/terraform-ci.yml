name: Terraform CI

on:
  push:
    branches: [main, develop]
    paths:
      - "**.tf"
      - "**.tfvars"
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"

jobs:
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - run: terraform fmt -check -recursive

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Validate AWS Dev
        run: |
          cd environments/dev/aws
          terraform init -backend=false
          terraform validate

      - name: Validate GCP Dev
        run: |
          cd environments/dev/gcp
          terraform init -backend=false
          terraform validate

  security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./
          framework: terraform
          soft_fail: false
          quiet: true

      - name: tfsec Scan
        uses: aquasecurity/tfsec-action@master
        with:
          working_directory: ./

  plan-aws:
    name: Terraform Plan (AWS Dev)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Plan
        id: plan
        run: |
          cd environments/dev/aws
          terraform init
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
        continue-on-error: true

      - uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/dev/aws/plan.txt', 'utf8');
            const output = `## Terraform Plan (AWS Dev)
            \`\`\`diff
            ${plan}
            \`\`\`
            ${{ steps.plan.outcome == 'success' && '✅ Plan succeeded' || '❌ Plan failed' }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
