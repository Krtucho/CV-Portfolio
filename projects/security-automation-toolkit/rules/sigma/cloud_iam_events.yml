title: Suspicious IAM Policy Change
id: 8c9f5d6e-7a1b-4c3d-8e9f-0a1b2c3d4e5f
status: experimental
description: Detects modification of IAM policies that could indicate privilege escalation
logsource:
  service: cloudtrail
  product: aws
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName:
      - PutRolePolicy
      - PutUserPolicy
      - AttachRolePolicy
      - AttachUserPolicy
      - CreatePolicy
      - DeletePolicy
      - UpdateAssumeRolePolicy
  condition: selection
falsepositives:
  - Legitimate administrative actions
  - Automated deployment scripts
level: high

---

title: Root Account Activity
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: Detects AWS root account usage (should be reserved for emergency only)
logsource:
  service: cloudtrail
  product: aws
detection:
  selection:
    userIdentity.type: Root
  condition: selection
falsepositives:
  - Legitimate break-glass procedures
  - Account setup
level: critical
